<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptUps — reps while Claude thinks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="idle">
  <div class="grain" aria-hidden="true"></div>

  <header>
    <div class="wordmark">PROMPT<span>UPS</span></div>
    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">connecting…</span>
    </div>
    <div class="header-actions">
      <button id="voice-btn" class="ghost-btn" title="Coach voice on/off">voice: on</button>
      <button id="test-btn" class="ghost-btn" title="Fake a Claude prompt to test rep counting">test drive</button>
    </div>
  </header>

  <main>
    <section class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="cue" id="cue">allow camera access to start</div>
      <div class="banner" id="banner">
        <div class="banner-title" id="banner-title">CLAUDE'S READY</div>
        <div class="banner-sub" id="banner-sub"></div>
      </div>
    </section>

    <aside class="board">
      <div class="board-label" id="board-label">REPS THIS PROMPT</div>
      <div class="rep-count" id="rep-count">0</div>
      <div class="set-timer mono" id="set-timer">00:00</div>

      <div class="control-group">
        <div class="control-label" id="exercise-label">exercise</div>
        <div class="exercise-picker" role="radiogroup" aria-labelledby="exercise-label">
          <button class="exercise-btn active" role="radio" aria-checked="true" data-exercise="squats">SQUATS</button>
          <button class="exercise-btn" role="radio" aria-checked="false" data-exercise="deskPushups">DESK PUSH-UPS</button>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label" for="camera-select">camera <span class="hint">(iPhone shows up here via Continuity Camera)</span></label>
        <select id="camera-select" class="mono"></select>
      </div>

      <dl class="tally">
        <div><dt>today</dt><dd id="stat-today">0</dd></div>
        <div><dt>all time</dt><dd id="stat-total">0</dd></div>
        <div><dt>best set</dt><dd id="stat-best">0</dd></div>
        <div><dt>prompts</dt><dd id="stat-sessions">0</dd></div>
      </dl>
    </aside>
  </main>

  <footer>
    <span>every frame is processed in this tab. nothing is uploaded, ever.</span>
    <span class="mono">hook bus: <code>localhost/promptups/start · /stop</code></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
