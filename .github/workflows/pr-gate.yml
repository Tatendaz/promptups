name: PR Gate

# Server-side mirror of the local pre-push gate from the tatendaz-github skill.
# Catches anyone (human or agent) who bypassed the local checks.
#
# This workflow enforces conventions that only exist in the context of a pull
# request. `npm test` is NOT here — ci.yml owns testing, on both push and PR,
# across the whole Node matrix. Keeping the `Tests` check in one file means one
# required status check name to configure and no chance of two jobs disagreeing.
#
# DO NOT add a `push:` trigger. github.head_ref is empty outside pull_request
# events, which collapses the docs-gate slug to "" and makes the glob match the
# first file in docs/ unconditionally — the gate would pass without checking
# anything. Both jobs below also carry an explicit event guard for that reason.

on:
  pull_request:
    branches: [main, master]
    # `labeled`/`unlabeled` are NOT in the default set (opened, synchronize,
    # reopened). Without them the `skip-docs-gate` bypass below is inert:
    # applying the label starts no run, and re-running the existing one
    # replays the original payload, which carries no label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Neither job needs more than the source tree. The repo default is currently
# "read", but that is a repo setting; declare it here so it cannot drift.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: Docs gate (features + summaries)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No fetch-depth: 0 — this job only inspects the checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive branch slug
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          branch="${HEAD_REF}"
          slug="${branch#feat/}"
          slug="${slug#feature/}"
          slug="${slug#fix/}"
          slug="${slug#chore/}"
          slug="${slug#docs/}"
          slug="${slug#refactor/}"
          slug="${slug#test/}"
          slug="${slug//\//-}"
          if [ -z "$slug" ]; then
            echo "::error::Could not derive a docs slug from branch '${branch}'."
            echo "Name your branch <type>/<slug> — see CONTRIBUTING.md."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Branch slug: $slug"

      # Branch names on fork PRs are untrusted input: pass the slug through
      # env instead of interpolating it into the script (workflow injection).
      # Git refnames cannot contain '*', '?' or '[', so it cannot become a glob.
      - name: Require docs/features entry
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          if ! ls docs/features/*"${SLUG}".md >/dev/null 2>&1; then
            echo "::error::Missing docs/features/<YYYY-MM-DD>-${SLUG}.md for this branch."
            echo "Add a feature-description markdown file under docs/features/ before merging."
            echo "See CONTRIBUTING.md for the format and a worked example."
            exit 1
          fi

      - name: Require docs/summaries entry
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          if ! ls docs/summaries/*"${SLUG}".md >/dev/null 2>&1; then
            echo "::error::Missing docs/summaries/<YYYY-MM-DD>-${SLUG}.md for this branch."
            echo "Add a session/prompt summary under docs/summaries/ before merging."
            echo "See CONTRIBUTING.md for the format and a worked example."
            exit 1
          fi

  coverage-for-new-code:
    name: New code has new tests
    # Maintainer escape hatch for changes that genuinely cannot be unit-tested.
    # A skipped required check does not block a merge, and only someone with
    # write access can apply a label — see CONTRIBUTING.md.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-docs-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No actions/setup-python step: it installed Python 3.11 and this check
      # never invoked it. The whole thing is git + grep.
      - name: Check that changed source files have changed tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"

          # `^test_` inside an alternation ending in `$` only ever matched the
          # literal string "test_"; the intent was a path-anchored Python test
          # file, so it gets its own pattern. .mjs/.cjs added throughout.
          src_changed="$(printf '%s\n' "$changed" \
            | grep -Ev '(^|/)(test|tests|__tests__|spec|docs|\.github)/' \
            | grep -Ev '(_test\.go|\.test\.(ts|tsx|js|jsx|mjs|cjs)|\.spec\.(ts|tsx|js|jsx|mjs|cjs)|_spec\.rb)$' \
            | grep -Ev '(^|/)test_[^/]+\.py$' \
            | grep -E '\.(py|ts|tsx|js|jsx|mjs|cjs|go|rs|rb|java|kt)$' || true)"

          test_changed="$(printf '%s\n' "$changed" \
            | grep -E '(^|/)(test|tests|__tests__|spec)/|_test\.go$|\.test\.(ts|tsx|js|jsx|mjs|cjs)$|\.spec\.(ts|tsx|js|jsx|mjs|cjs)$|(^|/)test_[^/]+\.py$|_spec\.rb$' || true)"

          # `wc -l` on an empty string still reports 1, because `printf '%s\n' ""`
          # emits a newline. `grep -c .` counts real lines.
          src_count="$(printf '%s\n' "$src_changed" | grep -c . || true)"
          test_count="$(printf '%s\n' "$test_changed" | grep -c . || true)"

          if [ "$src_count" -gt 0 ] && [ "$test_count" -eq 0 ]; then
            echo "::error::Source files changed but no test files changed:"
            printf '%s\n' "$src_changed"
            echo ""
            echo "Add tests covering the new behavior before merging."
            echo "public/app.js is the one file with no direct test: it is DOM +"
            echo "camera + MediaPipe wiring. Put the logic in public/session.js"
            echo "(or public/reps.js) and test it there — see CONTRIBUTING.md."
            exit 1
          fi
          echo "Source changes: ${src_count} file(s)"
          echo "Test changes:   ${test_count} file(s)"
